name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Run the example
        run: java -jar tollgate-example/target/tollgate-example-0.1.0.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify the core has no third-party runtime dependencies
        run: |
          ./mvnw -B -q -pl tollgate-core dependency:list -DincludeScope=runtime -DoutputFile=deps.txt
          echo "--- tollgate-core runtime dependencies ---"
          cat deps.txt
          if grep -qE ":(compile|runtime)" deps.txt; then
            echo "::error::tollgate-core must not declare third-party runtime dependencies (see ADR-0001)"
            exit 1
          fi
          echo "Core is dependency-free."
