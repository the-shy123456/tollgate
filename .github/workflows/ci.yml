name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `bash mvnw` rather than `./mvnw`: the wrapper works even if the executable
      # bit is lost when the repository is cloned on a filesystem that does not
      # carry one, which is a real risk for contributors on Windows.
      - name: Build and test
        run: bash mvnw -B verify

      - name: Run the example
        run: java -Dfile.encoding=UTF-8 -jar tollgate-example/target/tollgate-example-0.1.0.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify the core has no third-party runtime dependencies
        run: |
          # Absolute output path: -DoutputFile is resolved relative to the module
          # directory, not the reactor root, so a bare filename lands in
          # tollgate-core/ and is invisible from here.
          DEPS="$RUNNER_TEMP/core-runtime-deps.txt"

          bash mvnw -B -q -pl tollgate-core dependency:list \
            -DincludeScope=runtime \
            -DoutputFile="$DEPS"

          echo "--- resolved runtime dependencies ---"
          cat "$DEPS"

          # The module's own coordinates are reported without a scope, so anything
          # carrying :compile or :runtime is a genuine third-party dependency.
          offending=$(grep -E ":(compile|runtime)" "$DEPS" | grep -v 'io\.tollgate:' || true)

          if [ -n "$offending" ]; then
            echo "::error::tollgate-core must not declare third-party runtime dependencies (see ADR-0001)"
            echo "$offending"
            exit 1
          fi

          echo "Core is dependency-free."
